name: Generate 52-Week Plan
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install llama-cpp-python

      - name: Download Llama-3 Model
        run: |
          mkdir -p models
          # Using a publicly available small GGUF if possible, or placeholder
          # In reality, the user should provide a link or we use a standard one.
          curl -L "https://huggingface.co/QuantFactory/Meta-Llama-3-8B-Instruct-GGUF/resolve/main/Meta-Llama-3-8B-Instruct.Q4_K_M.gguf" -o models/llama-3-8b-instruct.Q4_K_M.gguf

      - name: Run Planning Script
        run: python scripts/generate_plan.py
        env:
          MODEL_PATH: "models/llama-3-8b-instruct.Q4_K_M.gguf"

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add planning.json
          git commit -m "docs: generate 52-week content plan" || echo "No changes to commit"
          git push
