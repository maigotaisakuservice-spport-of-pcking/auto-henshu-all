name: "The Studio: Production Pipeline"

on:
  workflow_dispatch:
    inputs:
      gdrive_url:
        description: "Google Driveの直ダウンロードリンク"
        required: true
      real_name:
        description: "検閲対象の本名（複数ある場合はコンマ区切り）"
        required: true
      encode_speed:
        description: "エンコード速度 (libx265)"
        type: choice
        default: "veryfast"
        options: ["ultrafast", "superfast", "veryfast", "faster", "fast", "medium"]
      video_quality:
        description: "画質設定 (CRF値: 低いほど高画質)"
        type: choice
        default: "23"
        options: ["18", "20", "23", "26", "28"]
      target_fps:
        description: "出力フレームレート (FPS)"
        type: choice
        default: "30"
        options: ["24", "30", "60"]
      tone:
        description: "動画のトーン"
        default: "明るい"
      target_duration:
        description: "最大出力時間（分）"
        default: "15"

jobs:
  build-and-deploy:
    runs-on: windows-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          choco install ffmpeg -y
          pip install -r requirements.txt

      - name: Execute Studio Engine
        env:
          PYTHONIOENCODING: utf-8
          YOUTUBE_SERVICE_ACCOUNT_JSON: ${{ secrets.YOUTUBE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          REAL_NAME: ${{ github.event.inputs.real_name }}
          TONE: ${{ github.event.inputs.tone }}
          GDRIVE_URL: ${{ github.event.inputs.gdrive_url }}
          ENCODE_SPEED: ${{ github.event.inputs.encode_speed }}
          VIDEO_QUALITY: ${{ github.event.inputs.video_quality }}
          TARGET_FPS: ${{ github.event.inputs.target_fps }}
          TARGET_DURATION: ${{ github.event.inputs.target_duration }}
        run: |
          python scripts/main_engine.py

      - name: Commit and Push New BGM & Meta
        run: |
          git config --global user.name "Studio Bot"
          git config --global user.email "studio-bot@example.com"
          # ファイルが存在しない場合にエラーにならないよう -f (force) を使うか、ワイルドカードがマッチしなくても通るようにする
          git add bgm/*.wav bgm/*.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add newly generated AI BGM and metadata" && git push)
        shell: bash
